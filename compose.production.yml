services:
  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: https://proimage.n8nmydomain.com
    image: open-prompts:production
    container_name: open-prompts
    restart: unless-stopped
    init: true
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=512
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXTAUTH_URL: https://proimage.n8nmydomain.com
      NEXT_PUBLIC_SITE_URL: https://proimage.n8nmydomain.com
    mem_limit: 768m
    pids_limit: 200
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:13281:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/en/').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
